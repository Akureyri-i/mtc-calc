[package]
name = "mtc-overlay"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
log = "0.4"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_UI_HiDpi", "Win32_Graphics_CompositionSwapchain", "Win32_Security", "Win32_UI_Controls", "Foundation_Numerics"] }
windows-numerics = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mtc-capture = { path = "../mtc-capture" }
mtc-dataset = { path = "../mtc-dataset" }
mtc-vision = { path = "../mtc-vision" }
png = "0.18.1"
