[package]
name = "mtc-maps"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Map configuration (from the upstream calculator) and the local reference-image cache"

[dependencies]
memmap2 = "0.9"
png = "0.18.1"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Memory"] }
