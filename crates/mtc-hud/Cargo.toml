[package]
name = "mtc-hud"
version = "0.1.4"
edition.workspace = true
license.workspace = true

[features]
# The release build: no console window (the output goes to the log file).
gui = []
# The release build: the map files and the game's fonts carried inside the program
# (`tools/release/bundle.py` gathers them into scratch/bundle, or `MTC_BUNDLE_DIR`).
bundle = []

[dependencies]
log = { version = "0.4", features = ["std"] }
ctrlc = "3.5.2"
ureq = "2.12"
mtc-ammo = { path = "../mtc-ammo" }
mtc-ballistics = { path = "../mtc-ballistics" }
mtc-capture = { version = "0.1.0", path = "../mtc-capture" }
mtc-dataset = { path = "../mtc-dataset" }
mtc-input = { path = "../mtc-input" }
mtc-maps = { path = "../mtc-maps" }
mtc-overlay = { version = "0.1.0", path = "../mtc-overlay" }
mtc-vision = { version = "0.1.0", path = "../mtc-vision" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_WindowsProgramming", "Win32_System_LibraryLoader", "Win32_Graphics_Dxgi", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-capture = "2"

[dev-dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[build-dependencies]
embed-resource = "3.0.12"
